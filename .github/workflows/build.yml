# Builds the loader, bundled mods and both packages (PC/MuMu installer and Magisk module).
# Every push / pull request: packages are attached to the run as artifacts.
# A pushed tag v* (e.g. v0.9.0): also publishes a GitHub release with both zips.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for the release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure
        run: >
          cmake -S loader -B loader/build -G "Unix Makefiles"
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build loader/build -j"$(nproc)"

      - name: Package
        run: |
          bash tools/make_dist.sh
          bash tools/make_magisk.sh
          VER=$(cat dist/ArkModLoader-*/VERSION | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          ls -la dist/*.zip

      - name: Check the tag matches the loader version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match kVersion $VER in loader/src/main.cpp"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ArkModLoader-${{ env.VER }}
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ArkModLoader-$VER-magisk.zip dist/ArkModLoader-$VER.zip \
            --title "ArkModLoader $VER" --generate-notes
